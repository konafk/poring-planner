# Runs every tests/*.test.mjs file with plain node (no dependencies), checks every tools/*.py script compiles, and clicks through the page in Chromium.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: |
          for f in tests/*.test.mjs; do
            echo "::group::$f"
            node "$f"
            echo "::endgroup::"
          done
      - name: Check the data exporters compile
        run: python3 -m py_compile tools/*.py

  # The real page in Chromium: every tab, search, the theme button and phone width (tests/browser/smoke.mjs)
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: npm i --no-save --no-package-lock playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Click through the page
        run: node tests/browser/smoke.mjs
