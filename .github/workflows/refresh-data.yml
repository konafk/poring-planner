# Once a week, refetches the data that comes from websites (gear, cards, skills, item text, NPC prices, affixes, recipes, icons) and opens a PR
# with whatever changed. Spawns and map names come from the installed game client, so they stay manual (docs/development.md, Tools).
# Needs Settings → Actions → General → Workflow permissions: "Allow GitHub Actions to create and approve pull requests".
# A PR opened by this workflow doesn't start the Tests workflow (GitHub doesn't run workflows for its own token's PRs), so the tests run
# here and their result goes in the PR description.
name: Refresh data

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The cache starts empty, so every page is fetched fresh (one per second): changed stats on existing items come through too.
      # Order matters: cardnames, iteminfo and icons read what export_prontera.py wrote and cached, and icons what export_recipes.py wrote. A script that fails (a site down)
      # leaves its files as they were, and the PR lists it.
      - name: Gear, cards, refine and skills (roz.prontera.info)
        id: prontera
        continue-on-error: true
        run: python tools/export_prontera.py
      - name: Card names in the equipment window (divine-pride.net)
        id: cardnames
        continue-on-error: true
        run: python tools/export_cardnames.py
      - name: Item descriptions, quests and drops
        id: iteminfo
        continue-on-error: true
        run: python tools/export_iteminfo.py
      - name: NPC prices, weights and item types (the community database)
        id: prices
        continue-on-error: true
        run: python tools/export_prices.py
      - name: Random options (the community database)
        id: affixes
        continue-on-error: true
        run: python tools/export_affixes.py
      - name: Crafting recipes (the community database)
        id: recipes
        continue-on-error: true
        run: python tools/export_recipes.py
      - name: Item icons and card pictures (divine-pride.net)
        id: icons
        continue-on-error: true
        run: python tools/export_icons.py
      - name: Run the tests on the new data
        id: tests
        continue-on-error: true
        run: |
          for f in tests/*.test.mjs; do node "$f" || exit 1; done
      - name: Describe the changes
        run: |
          {
            echo "Weekly data refresh from the sites in docs/data-sources.md ([run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))."
            echo
            failed=""
            for x in "prontera:${{ steps.prontera.outcome }}" "cardnames:${{ steps.cardnames.outcome }}" "iteminfo:${{ steps.iteminfo.outcome }}" \
                     "prices:${{ steps.prices.outcome }}" "affixes:${{ steps.affixes.outcome }}" "recipes:${{ steps.recipes.outcome }}" "icons:${{ steps.icons.outcome }}"; do
              [ "${x#*:}" = "success" ] || failed="$failed tools/export_${x%%:*}.py"
            done
            if [ -n "$failed" ]; then echo "**Failed, files left as they were:**$failed"; echo; fi
            if [ "${{ steps.tests.outcome }}" = "success" ]; then echo "Tests: passed on the new data."; else echo "**Tests: failed on the new data**: see the run log before merging."; fi
            echo
            echo "Check the diff before merging: an item a site failed to send is left out of the data, not kept."
            echo
            echo '```'
            git diff --stat
            echo '```'
          } > "$RUNNER_TEMP/pr-body.md"
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: data-refresh
          delete-branch: true
          commit-message: "Refresh data from the source sites"
          title: "Refresh data from the source sites"
          body-path: ${{ runner.temp }}/pr-body.md
          add-paths: |
            data/*.js
            img/*.png
